# /etc/nginx/conf.d/yuksaroy.uz.conf
# TLS blokini certbot o'zi qo'shadi:
#   certbot --nginx -d yuksaroy.uz -d www.yuksaroy.uz
# Konteynerlar: web 127.0.0.1:3200, api 127.0.0.1:4200 (deploy/compose.vps.yml).

server {
    listen 80;
    listen [::]:80;
    server_name yuksaroy.uz www.yuksaroy.uz;

    # Rasm yuklash chegarasi API dagi 5 MB bilan bir xil (ortiqchasini nginx darrov rad etadi)
    client_max_body_size 6m;

    access_log /var/log/nginx/yuksaroy.access.log;
    error_log  /var/log/nginx/yuksaroy.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Brauzer /api/v1/... ga so'raydi (cookie bir xil origin bo'lishi uchun): /api prefiksi olinadi
    location /api/v1/ {
        rewrite ^/api(/v1/.*)$ $1 break;
        proxy_pass http://127.0.0.1:4200;
        include /etc/nginx/proxy_params;
    }

    # Yuklangan fayllar va to'g'ridan-to'g'ri API chaqiruvlari
    location /v1/ {
        proxy_pass http://127.0.0.1:4200;
        include /etc/nginx/proxy_params;
    }

    # Qolgani Next.js
    location / {
        proxy_pass http://127.0.0.1:3200;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
