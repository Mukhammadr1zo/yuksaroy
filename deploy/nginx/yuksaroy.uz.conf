# /etc/nginx/conf.d/yuksaroy.uz.conf
# TLS blokini certbot o'zi qo'shadi (ikkala nomga bitta sertifikat):
#   certbot --nginx -d yuksaroy.uz -d www.yuksaroy.uz --redirect
# Certbot ishlagandan keyin bu fayl serverda o'zgaradi: ustidan nusxa ko'chirmang,
# aks holda TLS sozlamalari yo'qoladi. O'zgartirish kerak bo'lsa joyida tahrirlang.
# Konteynerlar: web 127.0.0.1:3310, api 127.0.0.1:4310 (deploy/compose.vps.yml).

# www bir xil sahifani ikkinchi manzilda bermasin: asosiy domenga yo'naltiriladi
server {
    listen 80;
    listen [::]:80;
    server_name www.yuksaroy.uz;
    return 308 https://yuksaroy.uz$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name yuksaroy.uz;

    # Rasm yuklash chegarasi API dagi 5 MB bilan bir xil (ortiqchasini nginx darrov rad etadi)
    client_max_body_size 6m;

    access_log /var/log/nginx/yuksaroy.access.log;
    error_log  /var/log/nginx/yuksaroy.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Brauzer /api/v1/... ga so'raydi (cookie bir xil origin bo'lishi uchun): /api prefiksi olinadi
    location /api/v1/ {
        rewrite ^/api(/v1/.*)$ $1 break;
        proxy_pass http://127.0.0.1:4310;
        include /etc/nginx/proxy_params;
    }

    # Yuklangan fayllar va to'g'ridan-to'g'ri API chaqiruvlari
    location /v1/ {
        proxy_pass http://127.0.0.1:4310;
        include /etc/nginx/proxy_params;
    }

    # Qolgani Next.js
    location / {
        proxy_pass http://127.0.0.1:3310;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
