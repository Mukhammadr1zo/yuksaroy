# /etc/nginx/conf.d/yuksaroy.uz.conf
# TLS blokini certbot o'zi qo'shadi (ikkala nomga bitta sertifikat):
#   certbot --nginx -d yuksaroy.uz -d www.yuksaroy.uz --redirect
# Certbot ishlagandan keyin bu fayl serverda o'zgaradi: ustidan nusxa ko'chirmang,
# aks holda TLS sozlamalari yo'qoladi. O'zgartirish kerak bo'lsa joyida tahrirlang.
# Konteynerlar: web 127.0.0.1:3310, api 127.0.0.1:4310 (deploy/compose.vps.yml).
#
# HTTP/2 (2026-10-07, egasi ruxsat berdi): certbot qo'shgan ikkala 443 blokida
#   listen 443 ssl http2;  va  listen [::]:443 ssl http2;
# bo'lishi kerak. Ilgari faqat HTTP/1.1 edi va brauzer 50-100 faylni navbat bilan olardi.
# nginx da bu parametr butun 443 portga tegishli: serverdagi boshqa saytlar ham HTTP/2 oladi.

# www bir xil sahifani ikkinchi manzilda bermasin: asosiy domenga yo'naltiriladi
server {
    listen 80;
    listen [::]:80;
    server_name www.yuksaroy.uz;
    return 308 https://yuksaroy.uz$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name yuksaroy.uz;

    # API 10 MB gacha rasmni qabul qiladi, shuning uchun bu yerda 11 MB: chegaradan oshgan
    # faylni API rad etsin, nginx emas. Ilgari bu yerda 6 MB turardi va 7 MB li rasm
    # yuklagan odam nginx ning inglizcha xato sahifasini ko'rardi, mahsulotning
    # "Fayl 10 MB dan katta" xabarini emas.
    client_max_body_size 11m;

    # Siqish (2026-10-07): API javoblari (JSON, xarita geojson) siqilmasdan borardi, xarita
    # ma'lumoti 48 KB edi, siqilgani 8 KB. Next.js sahifalarni o'zi siqadi, nginx ularni
    # qayta siqmaydi. gzip on nginx.conf da allaqachon yoqilgan, bu yerda faqat turlar.
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/geo+json application/javascript text/css text/plain image/svg+xml application/manifest+json;

    access_log /var/log/nginx/yuksaroy.access.log;
    error_log  /var/log/nginx/yuksaroy.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS: Next.js sahifalari uni o'zi qo'ymaydi (API qo'yadi). nginx TLS terminatori bo'lgani uchun shu yerda.
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # Brauzer /api/v1/... ga so'raydi (cookie bir xil origin bo'lishi uchun): /api prefiksi olinadi
    location /api/v1/ {
        rewrite ^/api(/v1/.*)$ $1 break;
        proxy_pass http://127.0.0.1:4310;
        include /etc/nginx/proxy_params;
    }

    # Yuklangan fayllar va to'g'ridan-to'g'ri API chaqiruvlari
    location /v1/ {
        proxy_pass http://127.0.0.1:4310;
        include /etc/nginx/proxy_params;
    }

    # Qolgani Next.js
    location / {
        proxy_pass http://127.0.0.1:3310;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
