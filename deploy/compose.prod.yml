# Prod: bitta VPS, bitta domen. Caddy TLS ni o'zi oladi va /api/v1 ni NestJS ga uzatadi.
# Ishga tushirish: cd /opt/yuksaroy && docker compose -f deploy/compose.prod.yml --env-file .env up -d --build
name: yuksaroy

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yuksaroy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}
      POSTGRES_DB: ${POSTGRES_DB:-yuksaroy}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yuksaroy} -d ${POSTGRES_DB:-yuksaroy}"]
      interval: 10s
      timeout: 3s
      retries: 20
    # Port tashqariga ochilmaydi: faqat ichki tarmoq

  api:
    image: ghcr.io/mukhammadr1zo/yuksaroy-api:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    env_file: [../.env]
    environment:
      NODE_ENV: production
      API_PORT: 4000
      TRUST_PROXY: "1" # Caddy ortida: haqiqiy IP X-Forwarded-For dan
      # Tashriflar xaritasi uchun joy bazasi. Fayl bo'lmasa xizmat baribir ishlaydi,
      # tashriflar esa "ZZ" bo'lib yoziladi.
      GEOIP_DB: /app/geo/GeoLite2-City.mmdb
    depends_on:
      db: { condition: service_healthy }
    # ../geo, ./geo emas: nisbiy yo'l shu faylning papkasiga (deploy/) nisbatan
    # hisoblanadi, ./geo esa $DIR/deploy/geo bo'lib, har deploydagi zaxira arxiviga tushardi
    volumes: ["uploads:/app/uploads", "../geo:/app/geo:ro"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    image: ghcr.io/mukhammadr1zo/yuksaroy-web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL kerak}
        NEXT_PUBLIC_BOT_USERNAME: ${NEXT_PUBLIC_BOT_USERNAME:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server komponentlar va /api/v1 rewrite ichki tarmoq orqali
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    depends_on:
      # service_started emas, service_healthy: web konteyner API javob berguncha kutadi.
      # Ilgari har deployda bir necha soniyalik oyna bor edi, o'sha paytda ochilgan
      # sahifa API ga yeta olmay xato ko'rsatardi. API ning tekshiruvi allaqachon bor.
      api: { condition: service_healthy }

  bot:
    image: ghcr.io/mukhammadr1zo/yuksaroy-bot:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.bot
    restart: unless-stopped
    env_file: [../.env]
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
    depends_on:
      api: { condition: service_started }

  caddy:
    image: caddy:2-alpine
    # Faqat 80/443 bo'sh bo'lgan serverda kerak: docker compose --profile caddy up -d
    # Nginx allaqachon turgan VPS da compose.vps.yml ishlatiladi, Caddy ishga tushmaydi.
    profiles: ["caddy"]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN kerak, masalan yuksaroy.uz}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
