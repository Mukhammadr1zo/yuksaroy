# Prodga chiqarish: obrazlar GHCR da quriladi, VPS faqat tortib oladi.
#
# Nega VPS da qurilmaydi: serverda 24 ta boshqa konteyner ishlayapti (uzrailmap, taminot, smm, uty)
# va Next qurilishi xotirani yeb, ularni yiqitishi mumkin. Shuning uchun qurish runner da.
#
# QO'LDA ishga tushiriladi (Actions > Deploy > Run workflow). Avtomatik emas: prodga
# har push bilan chiqish bu loyihada xohlanmaydi.
#
# Sirlar (Settings > Secrets and variables > Actions > Secrets):
#   VPS_HOST         MAJBURIY, server IP yoki domen
#   VPS_USER         MAJBURIY, ssh foydalanuvchi (masalan root)
#   VPS_SSH_KEY      MAJBURIY, private kalit (butun matn, -----BEGIN ... bilan)
#   VPS_PORT         ixtiyoriy, sukut 22
# O'zgaruvchilar (Variables tabi):
#   BOT_USERNAME     MAJBURIY, bo'sh qolsa Telegram bilan kirish tugmasi ishlamaydi
#   GOOGLE_CLIENT_ID MAJBURIY, bo'sh qolsa Google bilan kirish ishlamaydi
#   SITE_URL         ixtiyoriy, sukut https://yuksaroy.uz
#   VPS_PATH         ixtiyoriy, sukut /opt/yuksaroy
#
# Majburiylari yo'q bo'lsa ish boshida to'xtaydi va qaysi biri yo'qligini aytadi.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      skip_backup:
        description: "Baza zaxirasini o'tkazib yuborish (tavsiya etilmaydi)"
        type: boolean
        default: false

concurrency:
  # Ikkita deploy bir vaqtda ketmasin
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      # NEXT_PUBLIC_* qurilish paytida obrazga kiradi. Bo'sh qoldirilsa xato bermaydi,
      # shunchaki bo'sh bo'lib ketadi va prodda Telegram hamda Google bilan kirish
      # tugmasi ishlamay qoladi. Buni deploydan keyin topish qiyin, shuning uchun
      # oldindan to'xtatamiz.
      - name: O'zgaruvchilar to'liqmi
        env:
          BOT_USERNAME: ${{ vars.BOT_USERNAME }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          miss=""
          [ -n "$BOT_USERNAME" ] || miss="$miss BOT_USERNAME"
          [ -n "$GOOGLE_CLIENT_ID" ] || miss="$miss GOOGLE_CLIENT_ID"
          if [ -n "$miss" ]; then
            echo "Settings > Secrets and variables > Actions > Variables da yo'q:$miss"
            exit 1
          fi
          echo "o'zgaruvchilar joyida"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Obraz nomi kichik harfda bo'lishi shart: GHCR katta harfni qabul qilmaydi
      - name: Obraz prefiksi
        id: p
        run: echo "repo=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: API obrazi
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.p.outputs.repo }}/yuksaroy-api:latest
            ${{ env.REGISTRY }}/${{ steps.p.outputs.repo }}/yuksaroy-api:${{ github.sha }}
          # Paketni repo bilan bog'laydi. Yopiq repo uchun shart: bog'lanmagan paketga
          # ish jarayonining GITHUB_TOKEN i o'qish huquqiga ega bo'lmaydi.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Web obrazi
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          # NEXT_PUBLIC_* qurilish paytida obrazga kiradi: ishga tushganda o'zgartirib bo'lmaydi
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL || 'https://yuksaroy.uz' }}
            NEXT_PUBLIC_BOT_USERNAME=${{ vars.BOT_USERNAME }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.p.outputs.repo }}/yuksaroy-web:latest
            ${{ env.REGISTRY }}/${{ steps.p.outputs.repo }}/yuksaroy-web:${{ github.sha }}
          # Paketni repo bilan bog'laydi. Yopiq repo uchun shart: bog'lanmagan paketga
          # ish jarayonining GITHUB_TOKEN i o'qish huquqiga ega bo'lmaydi.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Bot obrazi
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.bot
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.p.outputs.repo }}/yuksaroy-bot:latest
            ${{ env.REGISTRY }}/${{ steps.p.outputs.repo }}/yuksaroy-bot:${{ github.sha }}
          # Paketni repo bilan bog'laydi. Yopiq repo uchun shart: bog'lanmagan paketga
          # ish jarayonining GITHUB_TOKEN i o'qish huquqiga ega bo'lmaydi.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot

  ship:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Muhitga tasdiq qo'yish mumkin: Settings > Environments > production > required reviewers
    environment: production
    permissions:
      contents: read
      # Server obrazlarni tortishi uchun GITHUB_TOKEN ga o'qish huquqi kerak
      packages: read
    steps:
      # Sirsiz ssh baribir yiqiladi, lekin xatosi tushunarsiz bo'ladi.
      # Bu yerda tekshiramiz: qaysi sir yo'qligi darrov ko'rinsin.
      - name: Sirlar to'liqmi
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
          K: ${{ secrets.VPS_SSH_KEY }}
        run: |
          miss=""
          [ -n "$H" ] || miss="$miss VPS_HOST"
          [ -n "$U" ] || miss="$miss VPS_USER"
          [ -n "$K" ] || miss="$miss VPS_SSH_KEY"
          if [ -n "$miss" ]; then
            echo "Settings > Secrets and variables > Actions > Secrets da yo'q:$miss"
            exit 1
          fi
          echo "sirlar joyida"

      - uses: actions/checkout@v4

      - name: SSH kaliti
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Serverdagi /opt/yuksaroy git klon emas (birinchi deploy shuni ko'rsatdi),
      # shuning uchun u yerda git bilan yangilab bo'lmaydi. Kerak ham emas:
      # runnerda repo allaqachon checkout qilingan va serverga faqat deploy papkasi
      # kerak. Migratsiyalar obraz ichidan keladi, server kodini o'qimaydi.
      # Yon foydasi: yopiq repoga kirish huquqi serverda umuman talab qilinmaydi.
      - name: Deploy fayllarini serverga ko'chirish
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
          P: ${{ secrets.VPS_PORT || 22 }}
          DIR: ${{ vars.VPS_PATH || '/opt/yuksaroy' }}
        run: |
          tar czf - deploy | ssh -i ~/.ssh/id -p "$P" "$U@$H" \
            "mkdir -p '$DIR' && cd '$DIR' && \
             (tar czf \$HOME/ys-deploy-bak-\$(date +%Y%m%d-%H%M%S).tgz deploy 2>/dev/null || true) && \
             tar xzf - && echo 'deploy fayllari yangilandi'"

      # Repo yopiq, shuning uchun GHCR dagi obrazlar ham yopiq: server ularni
      # parolsiz torta olmaydi va "docker compose pull" unauthorized beradi.
      # Token quvur orqali uzatiladi: na runner diskida, na buyruq qatorida qolmaydi.
      # Alohida DOCKER_CONFIG papkasi: serverdagi boshqa 24 ta konteynerning
      # umumiy ~/.docker/config.json fayliga tegmaymiz, ularning kaliti o'chmasin.
      - name: Server GHCR ga kirsin
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
          P: ${{ secrets.VPS_PORT || 22 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | ssh -i ~/.ssh/id -p "$P" "$U@$H" \
            "mkdir -p \$HOME/.docker-yuksaroy && DOCKER_CONFIG=\$HOME/.docker-yuksaroy docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
          P: ${{ secrets.VPS_PORT || 22 }}
          DIR: ${{ vars.VPS_PATH || '/opt/yuksaroy' }}
          SHA: ${{ github.sha }}
          SKIP_BACKUP: ${{ inputs.skip_backup }}
        run: |
          ssh -i ~/.ssh/id -p "$P" "$U@$H" bash -s <<EOF
          set -euo pipefail
          cd "$DIR"

          # DIQQAT: bu skript serverga stdin orqali beriladi (bash -s). Shuning uchun
          # bu yerda stdin ni o'qiydigan buyruq ishlatib bo'lmaydi. Masalan
          # "docker compose exec -T" stdin ni konteynerga ulaydi va skriptning
          # qolganini yutib yuboradi: bash EOF ga yetadi, 0 qaytaradi va deploy hech
          # narsa qilmay yashil bo'lib tugaydi. Yangi buyruq qo'shsangiz shuni eslang.

          # Boshqa loyihalarning docker hisob fayliga tegmaslik uchun alohida papka:
          # serverda yana 24 ta konteyner bor va ularning ghcr kaliti o'chib ketmasin.
          export DOCKER_CONFIG=\$HOME/.docker-yuksaroy
          # Tokenli papka har qanday holatda tozalansin, deploy yiqilsa ham
          trap 'rm -rf "\$DOCKER_CONFIG"' EXIT
          # Aynan shu commit obrazini ko'taramiz: latest bilan kod va obraz ajralib qolardi
          export IMAGE_TAG="$SHA"

          echo "== compose sozlamasi to'g'rimi =="
          # .env da majburiy o'zgaruvchi yetishmasa shu yerda to'xtaymiz,
          # konteynerlarga tegmasdan oldin
          docker compose -f deploy/compose.prod.yml -f deploy/compose.vps.yml --env-file .env config -q

          echo "== joriy obrazlar (qaytarish uchun) =="
          docker compose -f deploy/compose.prod.yml -f deploy/compose.vps.yml --env-file .env images | tee /tmp/ys-images-before.txt

          if [ "$SKIP_BACKUP" != "true" ]; then
            echo "== zaxira =="
            # Tayyor skript: pg_restore uchun qulay format, yuklangan fayllar ham,
            # eskilarini o'zi tozalaydi. Stdin ni o'qimaydi.
            # Skript .env ni o'qimaydi, o'z sukut qiymatlarini ishlatadi. Agar .env da
            # POSTGRES_USER yoki POSTGRES_DB o'zgartirilsa, shu yerda ovoz chiqarib
            # yiqiladi. Konteynerlarga hali tegilmagan bo'ladi.
            bash deploy/backup.sh
          fi

          echo "== obrazlarni tortib olish =="
          docker compose -f deploy/compose.prod.yml -f deploy/compose.vps.yml --env-file .env pull

          echo "== ko'tarish (api ishga tushganda migratsiyalarni o'zi qo'llaydi) =="
          docker compose -f deploy/compose.prod.yml -f deploy/compose.vps.yml --env-file .env up -d --no-build

          echo "== sog'liq tekshiruvi =="
          ok=0
          for i in \$(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:4310/v1/health >/dev/null 2>&1 \
               && curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:3310/ 2>/dev/null; then ok=1; break; fi
            sleep 5
          done
          if [ "\$ok" != "1" ]; then
            echo "SOG'LIQ TEKSHIRUVI O'TMADI, loglar:"
            docker compose -f deploy/compose.prod.yml -f deploy/compose.vps.yml --env-file .env logs --tail=60 api web
            exit 1
          fi
          echo "sog'lom"
          # Obrazlar endi commit tegi bilan keladi, ya'ni eskisi "dangling" bo'lmaydi va
          # oddiy prune ularni olib tashlamaydi. Har deployda uchta obraz qolib,
          # 60 GB lik disk asta to'lardi. Yorliq bo'yicha faqat shu loyihaniki tozalanadi:
          # serverdagi boshqa 24 ta konteynerning obraziga tegilmaydi.
          # Ishlab turgan konteyner o'z obrazini ushlab turadi, shuning uchun u o'chmaydi.
          docker image prune -af \
            --filter "label=org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            >/dev/null 2>&1 || true
          EOF

      - name: Tashqaridan tekshirish
        run: |
          SITE="${{ vars.SITE_URL || 'https://yuksaroy.uz' }}"
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$SITE/") || code=000
            api=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$SITE/api/v1/stats") || api=000
            echo "urinish $i: sayt=$code api=$api"
            if [ "$code" = "200" ] && [ "$api" = "200" ]; then echo "prod tirik"; exit 0; fi
            sleep 6
          done
          echo "prod javob bermayapti"
          exit 1
